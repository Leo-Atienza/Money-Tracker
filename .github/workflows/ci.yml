name: CI

# The repo has a 2400+ test suite and a `scripts/preflight.sh` gate, but until
# now nothing ran them automatically — the gate only fired if someone
# remembered to invoke it locally. This runs it on every push and PR.

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main, 'release/**']
  workflow_dispatch:

concurrency:
  # A newer push to the same ref makes the in-flight run irrelevant.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: analyze + test + lint sweep
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Pinned to the version the suite is green on locally. Bump
          # deliberately, not implicitly — a Flutter minor can change widget
          # layout and break golden-ish widget tests.
          flutter-version: '3.38.5'
          channel: stable
          cache: true

      - name: flutter pub get
        run: flutter pub get

      # scripts/preflight.sh is the single source of truth for the gate
      # (analyze + full suite + pass-count ratchet + forbidden-pattern sweep).
      # CI runs exactly what a developer runs locally rather than a second,
      # drifting copy of the rules.
      - name: preflight
        run: |
          chmod +x scripts/preflight.sh
          ./scripts/preflight.sh

  build-apk:
    name: release APK builds
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # No point burning a build slot if the suite is already red.
    needs: preflight

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: stable
          cache: true

      - name: flutter pub get
        run: flutter pub get

      # Compile-checks the Android side (Gradle config, manifest merge, plugin
      # wiring) which `flutter test` never touches. This is unsigned-by-CI: no
      # keystore secret is present, so the build falls back to the debug key and
      # prints its warning. That is fine — this artifact is a build check only
      # and is deliberately NOT uploaded or published anywhere.
      - name: build release APK (build check only — not for distribution)
        run: flutter build apk --release --target-platform android-arm64,android-arm

      - name: report APK size
        run: |
          apk=build/app/outputs/flutter-apk/app-release.apk
          ls -la "$apk"
          echo "### APK size: $(du -h "$apk" | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
          echo "ABIs packaged:" >> "$GITHUB_STEP_SUMMARY"
          unzip -l "$apk" | grep -oE '^.*lib/[^/]+' | grep -oE 'lib/[^/]+$' \
            | sort -u >> "$GITHUB_STEP_SUMMARY"
