org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# AGP 9 defaults both of these to true. They stay false on purpose, as in
# Flutter 3.47's own template: app_settings 7.0.0 applies kotlin-android
# unconditionally, which AGP 9 refuses once built-in Kotlin is on
# (android_file_picker, home_widget, package_info_plus and share_plus
# only apply it while built-in Kotlin is off, so they are ready), and the
# legacy DSL types Flutter still relies on sit behind newDsl=false. Flip
# builtInKotlin once app_settings has migrated, minding
# flutter/flutter#192167 (Flutter's Kotlin minimum-version check against
# AGP's bundled KGP). AGP 10 removes the newDsl opt-out.
# https://docs.flutter.dev/release/breaking-changes/migrate-to-built-in-kotlin
android.builtInKotlin=false
android.newDsl=false
